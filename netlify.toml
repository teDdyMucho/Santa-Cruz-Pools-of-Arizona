# Netlify configuration — Santa Cruz Pools of Arizona
# Suggested site name: santacruzpoolsaz  →  https://santacruzpoolsaz.netlify.app

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ / 22.12+. Pinned so a Netlify default bump
  # can't change the build out from under us.
  NODE_VERSION = "22"
  # `npm run media` is NOT part of the build: the WebP derivatives and the
  # manifest are committed, so production never needs sharp or the originals.
  NPM_FLAGS = "--include=dev"

# ---------------------------------------------------------------------------
# SPA fallback. react-router handles /studio, /services, /work, /process and
# /contact on the client, so every unmatched path must still be served
# index.html — otherwise a hard refresh or a shared deep link 404s.
# Must be the LAST redirect rule.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------

# Vite fingerprints these (index-a1b2c3.js), so the filename changes whenever
# the contents do — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Generated WebP. Filenames are stable across a re-run of `npm run media`, so
# these are NOT immutable — a week, then revalidate, so replacing a photo
# actually reaches people.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Source media. The clips are the heavy items (4–7 MB each) and never change
# once shot, so they get a long cache.
[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

# index.html must never be cached, or visitors keep booting the previous
# build's asset references after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
